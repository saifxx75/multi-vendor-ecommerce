spring.application.name=multi-vendor-ecommerce
server.port=${PORT:8080}

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/multivendor_db}
spring.datasource.username=${DB_USERNAME:marketplace_user}
spring.datasource.password=${DB_PASSWORD:Marketplace@123}

# update = Hibernate creates/updates tables automatically.
# Use DDL_AUTO=none if you created the schema yourself with database/schema.sql
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Avoids N+1 selects when lazy associations are loaded for a page of results
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---- JWT ----
# Must be at least 32 characters. Override with the JWT_SECRET environment variable in real deployments.
app.jwt.secret=${JWT_SECRET:multi-vendor-ecommerce-application-secret-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Seeded admin account (created on first start if it does not exist) ----
app.admin.name=${ADMIN_NAME:Platform Admin}
app.admin.email=${ADMIN_EMAIL:admin@marketplace.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
