# Used by integration tests (@ActiveProfiles("test")): in-memory H2 instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:marketplace_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=multi-vendor-ecommerce-application-secret-key
