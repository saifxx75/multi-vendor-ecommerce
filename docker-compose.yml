# Optional: starts a local PostgreSQL that matches application.properties defaults.
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: multivendor-postgres
    environment:
      POSTGRES_DB: multivendor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
